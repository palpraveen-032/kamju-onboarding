:root {
  --bg: #0A1024;
  --bg-soft: #111A33;
  --bg-deep: #080E22;
  --surface: rgba(255,255,255,0.06);
  --surface-2: rgba(255,255,255,0.10);

  --border: rgba(212,160,23,0.18);
  --border-strong: rgba(212,160,23,0.35);
  --gold: #D4A017;
  --gold-soft: #F5D67A;
  --gold-muted: rgba(212,160,23,0.12);
  --text: #F8F3E8;
  --text-muted: #A9B0C3;
  --text-faint: #6B7490;
  --success: #B8FF9A;

  --font-display: "Cormorant Garamond", Georgia, serif;

}

h1,h2,h3,.font-display {
  font-family: var(--font-display);
}

html, body {
  background: var(--bg);
  color: var(--text);
  margin: 0;
  overflow-x: clip;
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: rgba(212,160,23,0.25);
  border-radius: 999px;
}

/* Glass */

.glass {
  background: linear-gradient(135deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 100%);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--border);
}

.glass-strong {
  background: linear-gradient(135deg, rgba(18,28,61,0.85) 0%, rgba(10,16,36,0.92) 100%);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border);
}

.gold-glow {
  box-shadow: 0 0 0 1px rgba(212,160,23,0.15), 0 8px 40px rgba(212,160,23,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
}

.input-field {
  background: rgba(8,14,34,0.6);
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.24s ease;
}

.input-field:focus {
  border-color: var(--border-strong);
  background: rgba(12,20,48,0.85);
  box-shadow: 0 0 0 3px rgba(212,160,23,0.12);
  outline: none;
}

.input-field::-moz-placeholder {
  color: var(--text-faint);
}

.input-field::placeholder {

}
